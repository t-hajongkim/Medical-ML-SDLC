      - name: Echo detection step summary
        if: always() && steps.detection_guard.outputs.run_detection == 'true'
        continue-on-error: true
        run: |
          if [ -s /tmp/gh-aw/step-summary.md ]; then
            cat /tmp/gh-aw/step-summary.md
          fi
      - name: Render detection log
        if: always() && steps.detection_guard.outputs.run_detection == 'true'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { setupGlobals } = require('${{ runner.temp }}/gh-aw/actions/setup_globals.cjs');
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require('${{ runner.temp }}/gh-aw/actions/render_detection_log.cjs');
            await main();
      - name: Parse threat detection token usage for step summary
        id: parse_detection_token_usage
        if: always()
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_TOKEN_USAGE_SUMMARY_TITLE: Threat Detection Token Usage
        with:
          script: |
            const { setupGlobals } = require('${{ runner.temp }}/gh-aw/actions/setup_globals.cjs');
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require('${{ runner.temp }}/gh-aw/actions/parse_token_usage.cjs');
            await main();
      - name: Upload threat detection log
        if: always() && steps.detection_guard.outputs.run_detection == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: detection
          path: /tmp/gh-aw/threat-detection/detection.log
          if-no-files-found: ignore
      - name: Parse and conclude threat detection
        id: detection_conclusion
        if: always()
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RUN_DETECTION: ${{ steps.detection_guard.outputs.run_detection }}
          DETECTION_AGENTIC_EXECUTION_OUTCOME: ${{ steps.detection_agentic_execution.outcome }}
          GH_AW_DETECTION_CONTINUE_ON_ERROR: "true"
        with:
          script: |
            try {
              const { setupGlobals } = require('${{ runner.temp }}/gh-aw/actions/setup_globals.cjs');
              setupGlobals(core, github, context, exec, io, getOctokit);
              const { main } = require('${{ runner.temp }}/gh-aw/actions/parse_threat_detection_results.cjs');
              await main();
            } catch (loadErr) {
              const continueOnError = process.env.GH_AW_DETECTION_CONTINUE_ON_ERROR !== 'false';
              const detectionExecutionFailed = process.env.DETECTION_AGENTIC_EXECUTION_OUTCOME === 'failure';
              const msg = 'ERR_SYSTEM: \u274C Unexpected error loading threat detection module: ' + (loadErr && loadErr.message ? loadErr.message : String(loadErr));
              core.error(msg);
              core.setOutput('reason', 'parse_error');
              if (continueOnError && !detectionExecutionFailed) {
                core.warning('\u26A0\uFE0F ' + msg);
                core.setOutput('conclusion', 'warning');
                core.setOutput('success', 'false');
              } else {
                core.setOutput('conclusion', 'failure');
                core.setOutput('success', 'false');
                core.setFailed(msg);
              }
            }

  pre_activation:
    needs: resolve_review
    runs-on: ubuntu-slim
    env:
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
    outputs:
      activated: ${{ steps.check_membership.outputs.is_team_member == 'true' }}
      matched_command: ''
      setup-parent-span-id: ${{ steps.setup.outputs.parent-span-id || steps.setup.outputs.span-id }}
      setup-span-id: ${{ steps.setup.outputs.span-id }}
      setup-trace-id: ${{ steps.setup.outputs.trace-id }}
    steps:
      - name: Setup Scripts
        id: setup
        uses: github/gh-aw-actions/setup@6aab9e5b5c91c615506061f09bedd81a23babe3c # v0.86.2
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "연구 점검·평가계획"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/research-plan.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "1.0.79"
          GH_AW_INFO_AWF_VERSION: "v0.27.44"
          GH_AW_INFO_ENGINE_ID: "copilot"
      - name: Check team membership for workflow
        id: check_membership
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_REQUIRED_ROLES: "admin,maintainer,write"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { setupGlobals } = require('${{ runner.temp }}/gh-aw/actions/setup_globals.cjs');
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require('${{ runner.temp }}/gh-aw/actions/check_membership.cjs');
            await main();

  refresh_review_body:
    needs:
      - agent
      - detection
      - safe_outputs
    if: >
      (!cancelled()) && needs.agent.result != 'skipped' && contains(needs.agent.outputs.output_types, 'refresh_review_body') &&
      (needs.safe_outputs.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download agent output artifact
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent
          path: ${{ runner.temp }}/gh-aw/safe-jobs/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (source v8)
        env:
          GH_AW_AGENT_OUTPUT: ${{ runner.temp }}/gh-aw/safe-jobs/agent_output.json
        with:
          name: research-review-body-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/research-review-body
      - name: 분리된 safe-output 작업에서 보존된 본문을 그대로 게시
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 (source v9)
        env:
          GH_AW_AGENT_OUTPUT: ${{ runner.temp }}/gh-aw/safe-jobs/agent_output.json
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const crypto = require("node:crypto");
            const output = JSON.parse(fs.readFileSync(process.env.GH_AW_AGENT_OUTPUT, "utf8"));
            const items = output.items.filter(item => item.type === "refresh_review_body");
            if (items.length !== 1 || items[0].confirmed !== true) throw new Error("Publication was not confirmed");
            const message = items[0].message;
            if (typeof message !== "string" || !message.trim() || Buffer.byteLength(message, "utf8") > 4000
                || !/[가-힣]/.test(message)) throw new Error("A bounded Korean publication summary is required");
            const artifact = path.join(process.env.RUNNER_TEMP, "research-review-body");
            const meta = JSON.parse(fs.readFileSync(path.join(artifact, "publication.json"), "utf8"));
            const pr = String(meta.pull_request);
            if (!/^[1-9][0-9]*$/.test(pr)) throw new Error("Invalid validated PR");
            const body = fs.readFileSync(path.join(artifact, "pr-body.md"), "utf8");
            const hash = value => crypto.createHash("sha256").update(value, "utf8").digest("hex");
            if (meta.schema_version !== 2 || meta.operation !== "update" || meta.target_kind !== "pull_request"
                || meta.target_number !== Number(pr) || meta.pull_request !== Number(pr) || meta.body_refresh_required !== true
                || meta.repository !== process.env.GITHUB_REPOSITORY || hash(body) !== meta.body_sha256) {
              throw new Error("Publication artifact does not match the requested PR");
            }
            const pushes = output.items.filter(item => item.type === "push_to_pull_request_branch");
            if (output.items.some(item => item.type === "create_pull_request")
                || pushes.length !== (meta.publication_commit === null ? 0 : 1)) {
              throw new Error("PR push requests do not match the trusted application result");
            }
            const {data: current} = await github.rest.pulls.get({...context.repo, pull_number: Number(pr)});
            if (current.state !== "open" || current.head.repo.full_name !== meta.repository
                || current.head.ref !== meta.head_branch || !current.title.startsWith("연구검토 #")
                || hash(current.body || "") !== meta.previous_body_sha256) {
              throw new Error("PR changed; preserve human edits and request a fresh recommendation run");
            }
            const {data: commit} = await github.rest.git.getCommit({...context.repo, commit_sha: current.head.sha});
            if (commit.tree.sha !== meta.expected_tree_sha
                || (meta.publication_commit === null && current.head.sha !== meta.previous_head_sha)
                || (meta.publication_commit !== null && (commit.parents.length !== 1
                    || commit.parents[0].sha !== meta.previous_head_sha))) {
              throw new Error("The validated report commit was not published to this PR");
            }
            await github.rest.pulls.update({...context.repo, pull_number: Number(pr), body});
            await github.rest.issues.createComment({
              ...context.repo, issue_number: Number(pr),
              body: "**AI 조율 결과 · 사람의 승인 대기**\n\n" + message.trim()
                + "\n\n모델 실행·최종 평가·임상 사용 승인은 수행하지 않았습니다. 변경된 계획을 확인한 뒤 사람이 Merge합니다."
            });
            core.info("검증된 자동 생성 영역을 갱신하고 사람의 원문을 보존했습니다.");

  resolve_review:
    if: >
      github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event != 'issue_comment' ||
      github.event.workflow_run.actor.type == 'User'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      issue_number: ${{ steps.resolve.outputs.issue_number }}
      pull_request: ${{ steps.resolve.outputs.pull_request }}
      ready: ${{ steps.resolve.outputs.ready }}
      request_actor: ${{ steps.resolve.outputs.request_actor }}
      target_kind: ${{ steps.resolve.outputs.target_kind }}
      target_number: ${{ steps.resolve.outputs.target_number }}
    steps:
      - name: Configure GH_HOST for enterprise compatibility
        id: ghes-host-config
        shell: bash
        run: | # zizmor: ignore[github-env] - GITHUB_SERVER_URL is set by GitHub Actions, not user input.
          # Derive GH_HOST from GITHUB_SERVER_URL so the gh CLI targets the correct
          # GitHub instance (GHES/GHEC). On github.com this is a harmless no-op.
          GH_HOST="${GITHUB_SERVER_URL#https://}"
          GH_HOST="${GH_HOST#http://}"
          echo "GH_HOST=${GH_HOST}" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install Issue Form parser for target validation
        run: python -B -m pip install --disable-pip-version-check -r requirements-workflow.txt
      - name: Resolve the exact authorized Issue or PR from a trusted completed workflow
        id: resolve
        run: python -B -m app.research resolve-ai-target
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_PR: ${{ inputs.pull_request }}
      - name: Save the exact authorized dashboard target
        run: python -B -m app.dashboard target
        env:
          TARGET_KIND: ${{ steps.resolve.outputs.target_kind }}
          TARGET_NUMBER: ${{ steps.resolve.outputs.target_number }}
          TARGET_READY: ${{ steps.resolve.outputs.ready }}
      - name: Preserve dashboard routing metadata only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (source v7)
        with:
          if-no-files-found: error
          name: dashboard-target-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dashboard-target.json
          retention-days: 30

  safe_outputs:
    needs:
      - activation
      - agent
      - detection
      - resolve_review
    if: (!cancelled()) && needs.agent.result != 'skipped' && needs.detection.result == 'success'
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 45
    env:
      GH_AW_AGENT_AIC: ${{ needs.agent.outputs.aic }}
      GH_AW_AIC: ${{ needs.agent.outputs.aic }}
      GH_AW_AMBIENT_CONTEXT: ${{ needs.agent.outputs.ambient_context }}
      GH_AW_CALLER_WORKFLOW_ID: "${{ github.repository }}/research-plan"
      GH_AW_DETECTION_CONCLUSION: ${{ needs.detection.outputs.detection_conclusion }}
      GH_AW_DETECTION_REASON: ${{ needs.detection.outputs.detection_reason }}
      GH_AW_EFFECTIVE_TOKENS: ${{ needs.agent.outputs.effective_tokens }}
      GH_AW_ENGINE_ID: "copilot"
      GH_AW_ENGINE_MODEL: ${{ needs.agent.outputs.model }}
      GH_AW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
      GH_AW_SAFE_OUTPUT_MESSAGES: "{\"activationComments\":\"false\"}"
      GH_AW_THREAT_DETECTION_AIC: ${{ needs.detection.outputs.aic }}
      GH_AW_WORKFLOW_ID: "research-plan"
      GH_AW_WORKFLOW_NAME: "연구 점검·평가계획"
      GH_AW_WORKFLOW_SOURCE_URL: "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/.github/workflows/research-plan.md"
    outputs:
      code_push_failure_count: ${{ steps.process_safe_outputs.outputs.code_push_failure_count }}
      code_push_failure_errors: ${{ steps.process_safe_outputs.outputs.code_push_failure_errors }}
      create_discussion_error_count: ${{ steps.process_safe_outputs.outputs.create_discussion_error_count }}
      create_discussion_errors: ${{ steps.process_safe_outputs.outputs.create_discussion_errors }}
      created_pr_number: ${{ steps.process_safe_outputs.outputs.created_pr_number }}
      created_pr_url: ${{ steps.process_safe_outputs.outputs.created_pr_url }}
      process_safe_outputs_items_applied: ${{ steps.process_safe_outputs.outputs.items_applied }}
      process_safe_outputs_items_cancelled: ${{ steps.process_safe_outputs.outputs.items_cancelled }}
      process_safe_outputs_items_deferred: ${{ steps.process_safe_outputs.outputs.items_deferred }}
      process_safe_outputs_items_failed: ${{ steps.process_safe_outputs.outputs.items_failed }}
      process_safe_outputs_items_skipped: ${{ steps.process_safe_outputs.outputs.items_skipped }}
      process_safe_outputs_items_succeeded: ${{ steps.process_safe_outputs.outputs.items_succeeded }}
      process_safe_outputs_items_warnings: ${{ steps.process_safe_outputs.outputs.items_warnings }}
      process_safe_outputs_processed_count: ${{ steps.process_safe_outputs.outputs.processed_count }}
      process_safe_outputs_status: ${{ steps.process_safe_outputs.outputs.status }}
      process_safe_outputs_temporary_id_map: ${{ steps.process_safe_outputs.outputs.temporary_id_map }}
      push_commit_sha: ${{ steps.process_safe_outputs.outputs.push_commit_sha }}
      push_commit_url: ${{ steps.process_safe_outputs.outputs.push_commit_url }}
    steps:
      - name: Setup Scripts
        id: setup
        uses: github/gh-aw-actions/setup@6aab9e5b5c91c615506061f09bedd81a23babe3c # v0.86.2
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
          trace-id: ${{ needs.activation.outputs.setup-trace-id }}
          parent-span-id: ${{ needs.activation.outputs.setup-parent-span-id || needs.activation.outputs.setup-span-id }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "연구 점검·평가계획"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/research-plan.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "1.0.79"
          GH_AW_INFO_AWF_VERSION: "v0.27.44"
          GH_AW_INFO_ENGINE_ID: "copilot"
      - name: Download agent output artifact
        id: download-agent-output
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent
          path: /tmp/gh-aw/
      - name: Setup agent output environment variable
        id: setup-agent-output-env
        if: steps.download-agent-output.outcome == 'success'
        run: |
          mkdir -p /tmp/gh-aw/
          find "/tmp/gh-aw/" -type f -print
          echo "GH_AW_AGENT_OUTPUT=/tmp/gh-aw/agent_output.json" >> "$GITHUB_OUTPUT"
      - name: Download patch artifact
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent
          path: /tmp/gh-aw/
      - name: Checkout repository
        if: (!cancelled()) && needs.agent.result != 'skipped' && contains(needs.agent.outputs.output_types, 'create_pull_request') || (!cancelled()) && needs.agent.result != 'skipped' && contains(needs.agent.outputs.output_types, 'push_to_pull_request_branch')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure Git credentials
        if: (!cancelled()) && needs.agent.result != 'skipped' && contains(needs.agent.outputs.output_types, 'create_pull_request') || (!cancelled()) && needs.agent.result != 'skipped' && contains(needs.agent.outputs.output_types, 'push_to_pull_request_branch')
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash "${RUNNER_TEMP}/gh-aw/actions/configure_git_credentials.sh"
      - name: Configure GH_HOST for enterprise compatibility
        id: ghes-host-config
        shell: bash
        run: | # zizmor: ignore[github-env] - GITHUB_SERVER_URL is set by GitHub Actions, not user input.
          # Derive GH_HOST from GITHUB_SERVER_URL so the gh CLI targets the correct
          # GitHub instance (GHES/GHEC). On github.com this is a harmless no-op.
          GH_HOST="${GITHUB_SERVER_URL#https://}"
          GH_HOST="${GH_HOST#http://}"
          echo "GH_HOST=${GH_HOST}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (source v8)
        with:
          name: research-review-body-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/research-review-body
      - name: Validate prepared publication before writing
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 (source v9)
        env:
          GH_AW_ACTIONS_DIR: ${{ runner.temp }}/gh-aw/actions
          GH_AW_AGENT_OUTPUT: /tmp/gh-aw/agent_output.json
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const crypto = require("node:crypto");
            const { sanitizeContent } = require(path.join(process.env.GH_AW_ACTIONS_DIR, "sanitize_content.cjs"));
            const directory = path.join(process.env.RUNNER_TEMP, "research-review-body");
            const meta = JSON.parse(fs.readFileSync(path.join(directory, "publication.json"), "utf8"));
            const body = fs.readFileSync(path.join(directory, "pr-body.md"), "utf8");
            const hash = value => crypto.createHash("sha256").update(value, "utf8").digest("hex");
            if (meta.schema_version !== 2 || meta.repository !== process.env.GITHUB_REPOSITORY
                || hash(body) !== meta.body_sha256) {
              throw new Error("Invalid trusted publication metadata or body");
            }
            const output = JSON.parse(fs.readFileSync(process.env.GH_AW_AGENT_OUTPUT, "utf8"));
            const items = output.items;
            if (!Array.isArray(items) || items.some(item =>
                ["report_incomplete", "missing_tool", "missing_data"].includes(item.type))) {
              throw new Error("Copilot did not prepare a complete publication");
            }
            const creates = items.filter(item => item.type === "create_pull_request");
            const pushes = items.filter(item => item.type === "push_to_pull_request_branch");
            const refreshes = items.filter(item => item.type === "refresh_review_body");
            if (meta.operation === "create") {
              if (meta.target_kind !== "issue" || !Number.isSafeInteger(meta.target_number)
                  || meta.target_number !== meta.issue_number || meta.pull_request !== null
                  || typeof meta.publication_commit !== "string"
                  || !/^[0-9a-f]{40}$/.test(meta.publication_commit)
                  || meta.body_refresh_required !== false
                  || creates.length !== 1 || pushes.length || refreshes.length
                  || creates[0].title !== meta.pull_request_title
                  || creates[0].body !== sanitizeContent(body)
                  || creates[0].branch !== meta.head_branch
                  || ("repo" in creates[0] ? creates[0].repo : meta.repository) !== meta.repository) {
                throw new Error("Initial creation must declare the validated title, normalized body and branch once");
              }
            } else if (meta.operation === "update") {
              const canonicalPR = value => Number.isSafeInteger(value) && value > 0 ? value :
                typeof value === "string" && /^[1-9][0-9]{0,9}$/.test(value) ? Number(value) : null;
              if (meta.target_kind !== "pull_request" || !Number.isSafeInteger(meta.pull_request)
                  || meta.pull_request < 1 || meta.target_number !== meta.pull_request
                  || creates.length || typeof meta.body_refresh_required !== "boolean"
                  || pushes.length !== Number(meta.publication_commit !== null)
                  || refreshes.length !== Number(meta.body_refresh_required)
                  || pushes.some(item => item.branch !== meta.head_branch
                    || canonicalPR("pull_request_number" in item ? item.pull_request_number : meta.pull_request) !== meta.pull_request
                    || ("repo" in item ? item.repo : meta.repository) !== meta.repository)
                  || refreshes.some(item => item.confirmed !== true
                    || typeof item.message !== "string" || !item.message.trim())) {
                throw new Error("Validated update is missing its exact push/body declarations");
              }
            } else {
              throw new Error("Invalid publication operation");
            }
            core.info("Prepared publication verified before any report push or PR creation");
      - name: Process Safe Outputs
        id: process_safe_outputs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_AGENT_OUTPUT: ${{ steps.setup-agent-output-env.outputs.GH_AW_AGENT_OUTPUT }}
          GH_AW_COMMENT_ID: ${{ needs.activation.outputs.comment_id }}
          GH_AW_ALLOWED_DOMAINS: "api.business.githubcopilot.com,api.enterprise.githubcopilot.com,api.github.com,api.githubcopilot.com,api.individual.githubcopilot.com,api.snapcraft.io,archive.ubuntu.com,azure.archive.ubuntu.com,crl.geotrust.com,crl.globalsign.com,crl.identrust.com,crl.sectigo.com,crl.thawte.com,crl.usertrust.com,crl.verisign.com,crl3.digicert.com,crl4.digicert.com,crls.ssl.com,github.com,host.docker.internal,json-schema.org,json.schemastore.org,keyserver.ubuntu.com,ocsp.digicert.com,ocsp.geotrust.com,ocsp.globalsign.com,ocsp.identrust.com,ocsp.sectigo.com,ocsp.ssl.com,ocsp.thawte.com,ocsp.usertrust.com,ocsp.verisign.com,packagecloud.io,packages.cloud.google.com,packages.microsoft.com,ppa.launchpad.net,raw.githubusercontent.com,registry.npmjs.org,s.symcb.com,s.symcd.com,security.ubuntu.com,telemetry.enterprise.githubcopilot.com,ts-crl.ws.symantec.com,ts-ocsp.ws.symantec.com,www.googleapis.com"
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_API_URL: ${{ github.api_url }}
          GH_AW_SAFE_OUTPUT_JOBS: "{\"refresh_review_body\":\"\"}"
          GH_AW_SAFE_OUTPUTS_HANDLER_CONFIG: "{\"create_pull_request\":{\"allowed_branches\":[\"research/review-issue-*\"],\"allowed_files\":[\"research/reports/**/request.json\",\"research/reports/**/selection.json\",\"research/reports/**/ai-recommendations.json\",\"research/reports/**/eda-plan.json\",\"research/reports/**/evaluation-plan.json\",\"research/reports/**/eda.json\",\"research/reports/**/report.md\",\"research/reports/**/recommendation-request.json\",\"research/reports/**/input-schema.json\",\"research/reports/**/input-mapping.json\",\"research/reports/**/coordination-plan.json\",\"research/reports/**/feedback-applied.json\",\"research/reports/**/execution-plan.json\"],\"auto_close_issue\":false,\"draft\":true,\"fallback_as_issue\":false,\"max\":1,\"max_patch_files\":100,\"max_patch_size\":4096,\"preserve_branch_name\":true,\"protect_top_level_dot_folders\":true,\"protected_files\":[\"package.json\",\"bun.lockb\",\"bunfig.toml\",\"deno.json\",\"deno.jsonc\",\"deno.lock\",\"global.json\",\"NuGet.Config\",\"Directory.Packages.props\",\"mix.exs\",\"mix.lock\",\"go.mod\",\"go.sum\",\"stack.yaml\",\"stack.yaml.lock\",\"pom.xml\",\"build.gradle\",\"build.gradle.kts\",\"settings.gradle\",\"settings.gradle.kts\",\"gradle.properties\",\"package-lock.json\",\"yarn.lock\",\"pnpm-lock.yaml\",\"npm-shrinkwrap.json\",\"requirements.txt\",\"Pipfile\",\"Pipfile.lock\",\"pyproject.toml\",\"setup.py\",\"setup.cfg\",\"Gemfile\",\"Gemfile.lock\",\"uv.lock\",\"CODEOWNERS\",\"DESIGN.md\",\"README.md\",\"CONTRIBUTING.md\",\"CHANGELOG.md\",\"SECURITY.md\",\"CODE_OF_CONDUCT.md\",\"AGENTS.md\"],\"protected_files_policy\":\"blocked\"},\"missing_data\":{},\"missing_tool\":{},\"noop\":{\"max\":1,\"report-as-issue\":\"false\"},\"push_to_pull_request_branch\":{\"allowed_files\":[\"research/reports/**/ai-recommendations.json\",\"research/reports/**/eda-plan.json\",\"research/reports/**/evaluation-plan.json\",\"research/reports/**/eda.json\",\"research/reports/**/report.md\",\"research/reports/**/recommendation-request.json\",\"research/reports/**/input-schema.json\",\"research/reports/**/input-mapping.json\",\"research/reports/**/coordination-plan.json\",\"research/reports/**/feedback-applied.json\",\"research/reports/**/selection.json\",\"research/reports/**/execution-plan.json\"],\"excluded_files\":[\"research/reports/**/request.json\",\"research/reports/**/feedback-requests.json\"],\"fallback_as_pull_request\":false,\"if_no_changes\":\"error\",\"max\":1,\"max_patch_size\":4096,\"protect_top_level_dot_folders\":true,\"protected_files\":[\"package.json\",\"bun.lockb\",\"bunfig.toml\",\"deno.json\",\"deno.jsonc\",\"deno.lock\",\"global.json\",\"NuGet.Config\",\"Directory.Packages.props\",\"mix.exs\",\"mix.lock\",\"go.mod\",\"go.sum\",\"stack.yaml\",\"stack.yaml.lock\",\"pom.xml\",\"build.gradle\",\"build.gradle.kts\",\"settings.gradle\",\"settings.gradle.kts\",\"gradle.properties\",\"package-lock.json\",\"yarn.lock\",\"pnpm-lock.yaml\",\"npm-shrinkwrap.json\",\"requirements.txt\",\"Pipfile\",\"Pipfile.lock\",\"pyproject.toml\",\"setup.py\",\"setup.cfg\",\"Gemfile\",\"Gemfile.lock\",\"uv.lock\",\"CODEOWNERS\",\"DESIGN.md\",\"README.md\",\"CONTRIBUTING.md\",\"CHANGELOG.md\",\"SECURITY.md\",\"CODE_OF_CONDUCT.md\",\"AGENTS.md\"],\"protected_files_policy\":\"blocked\",\"target\":\"${{ needs.resolve_review.outputs.pull_request }}\",\"title_prefix\":\"연구검토 #\"},\"report_incomplete\":{}}"
          GH_AW_CI_TRIGGER_TOKEN: ${{ secrets.GH_AW_CI_TRIGGER_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { setupGlobals } = require('${{ runner.temp }}/gh-aw/actions/setup_globals.cjs');
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require('${{ runner.temp }}/gh-aw/actions/process_safe_outputs.cjs');
            await main();
      - name: Upload Safe Outputs Items
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: safe-outputs-items
          path: |
            /tmp/gh-aw/safe-output-items.jsonl
            /tmp/gh-aw/temporary-id-map.json
          if-no-files-found: ignore
