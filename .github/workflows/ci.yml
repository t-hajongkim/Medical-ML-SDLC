name: Check workshop setup

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  check-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ml.txt
      - name: Install pinned test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ml.txt
      - name: Check data-only publication and legacy drafts with synthetic fixtures
        run: python -B -m unittest discover -s tests -p "test_*.py" -v
