name: Prepare evaluation result PR2

on:
  workflow_run:
    workflows: ["Evaluate merged research plan"]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: publish-evaluation-${{ github.repository }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  publish-result:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.repository.full_name == github.repository && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted default-branch publisher
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Verify the exact successful inference workflow
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          python -B -m app.result_review resolve-source \
            --run-id "$SOURCE_RUN" --attempt "$SOURCE_ATTEMPT"
      - name: Save the verified evaluation target for the dashboard
        env:
          TARGET_NUMBER: ${{ github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: python -B -m app.dashboard target --kind evaluation_run --evaluation-attempt "$SOURCE_ATTEMPT"
      - name: Preserve dashboard routing metadata only
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-target-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dashboard-target.json
          if-no-files-found: error
          retention-days: 30
      - name: Read aggregate files only from the verified source run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          path: ${{ runner.temp }}/evaluation-publication
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          merge-multiple: true
      - name: Create or update the aggregate result review PR
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          python -B -m app.result_review publish \
            --run-id "$SOURCE_RUN" --attempt "$SOURCE_ATTEMPT" \
            --directory "$RUNNER_TEMP/evaluation-publication"
