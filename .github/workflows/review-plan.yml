name: Review selections and freeze approved plan

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [closed]

permissions: {}

concurrency:
  group: research-plan-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  review-plan:
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request) ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'research/review-issue-') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: write
      pull-requests: write
      issues: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out trusted default-branch code only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install workflow-only dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-workflow.txt
      - name: Verify source-only review contracts
        run: python -B -m unittest discover -s tests -p 'test_review_plan.py' -v
      - name: Apply explicit human commands or freeze merged educational plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B -m app.review
