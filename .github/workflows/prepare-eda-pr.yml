name: Prepare research review

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing research Issue number (positive integer)
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: research-review-${{ github.repository }}-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  prepare-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out trusted default-branch code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install Issue Form parser
        run: python -m pip install --disable-pip-version-check -r requirements-workflow.txt
      - name: Validate authorized research Issue and request private analysis
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          export RESEARCH_WORK_DIRECTORY="$RUNNER_TEMP/research-review-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python -B -m app.research workflow
      - name: Hand off exact recommendation target to workflow_run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: research-ai-target-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/research-ai-target.json
          if-no-files-found: error
          retention-days: 1
