name: Review evaluation plan feedback

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: research-plan-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  review-plan:
    if: github.event.issue.pull_request && github.event.comment.user.type == 'User'
    permissions:
      contents: write
      pull-requests: read
      issues: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out trusted default-branch code only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Queue authorized natural-language feedback for AI planning
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B -m app.review_eval_plan
      - name: Hand off exact recommendation target to workflow_run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: research-ai-target-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/research-ai-target.json
          if-no-files-found: error
          retention-days: 1
