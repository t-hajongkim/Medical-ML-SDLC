name: Publish empty template preview

on:
  push:
    branches: [main]
    paths:
      - dashboard/**
      - .github/workflows/deploy-template-preview.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: template-pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 't-hajongkim/Medical-ML-SDLC' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Require an empty template without a live research source
        run: |
          node <<'JS'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const path = require("node:path");
          const vm = require("node:vm");
          const assets = path.join("dashboard", "assets");
          const data = JSON.parse(fs.readFileSync(path.join(assets, "dashboard-data.json"), "utf8"));
          const context = {window: {}};
          for (const name of ["dashboard-data.js", "dashboard-source.js"]) {
            vm.runInNewContext(fs.readFileSync(path.join(assets, name), "utf8"), context);
          }
          assert.deepEqual(JSON.parse(JSON.stringify(context.window.DASHBOARD_DATA)), data);
          assert.equal(context.window.DASHBOARD_SOURCE, null);
          assert.equal(data.target, null);
          assert.equal(data.pipeline.issue_number, null);
          assert.equal(data.generated_at, null);
          assert.deepEqual(data.dataset, {});
          assert.deepEqual(data.eda.results, []);
          assert.deepEqual(data.evaluation_plan, {});
          for (const key of ["remote_pr1", "local_smoke", "remote_model_evaluation", "remote_pr2"]) {
            assert.equal(data[key], null);
          }
          console.log("Only the empty, unconnected dashboard template will be deployed.");
          JS
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dashboard
      - name: Publish the empty preview
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
